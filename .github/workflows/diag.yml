name: diag
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "history run whose feature tables to read"
        type: string
  push:
    branches: [main]
    paths: [".github/diag_trends.py", ".github/diag_run_id", ".github/workflows/diag.yml"]
permissions:
  contents: read
  actions: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - id: rid
        run: echo "id=$(cat .github/diag_run_id)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: history-features
          path: feat
          run-id: ${{ inputs.run_id || steps.rid.outputs.id }}
          github-token: ${{ github.token }}
      - run: python .github/diag_trends.py feat
